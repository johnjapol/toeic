<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* layout: 투자 퀴즈와 같은 형식 — 상단 LC/RC/단답식 탭 + Day 칩, 카드 목록, 카드마다 정답 펼치기 */
  --bg:#f6f5f1; --surface:#ffffff; --fg:#1f2a26; --muted:#66716c; --line:#dcdad2;
  --green:#0f5c47; --green-fg:#ffffff; --green-soft:#d9eadf; --green-line:#b9d6c5;
  --ok:#1b7548; --ok-soft:#e1f2e9; --bad:#b0372b; --bad-soft:#fbe8e5;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1d2320; --fg:#e8eeea; --muted:#9ba7a1; --line:#2f3733;
  --green:#58c49b; --green-fg:#0c1a14; --green-soft:#1c3328; --green-line:#2f5a46;
  --ok:#62c993; --ok-soft:#173226; --bad:#f08a7e; --bad-soft:#3a1e1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1d2320; --fg:#e8eeea; --muted:#9ba7a1; --line:#2f3733;
  --green:#58c49b; --green-fg:#0c1a14; --green-soft:#1c3328; --green-line:#2f5a46;
  --ok:#62c993; --ok-soft:#173226; --bad:#f08a7e; --bad-soft:#3a1e1b; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.7;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 72px}
h1{font-size:26px;line-height:1.3;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14.5px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tab{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:42px}
.tab[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--green-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px;width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.all{font:inherit;font-size:13.5px;border:1px solid var(--green);background:var(--surface);color:var(--green);font-weight:700;border-radius:999px;padding:5px 14px;cursor:pointer;min-height:36px}
.tab:focus-visible,.chip:focus-visible,.all:focus-visible,summary:focus-visible,.opt:focus-visible,td.h:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.desc{color:var(--muted);font-size:14px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 4px;margin:0 0 12px;min-width:0}
.q{display:flex;gap:8px;align-items:baseline}
.num{font-weight:700;flex:none;font-variant-numeric:tabular-nums;color:var(--green)}
.stem{font-weight:500;min-width:0;overflow-wrap:break-word}
.opts{display:grid;gap:2px;margin:8px 0 4px}
.opt{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent;background:transparent;color:var(--fg);padding:8px 10px;border-radius:10px;cursor:pointer;width:100%;min-height:42px;overflow-wrap:break-word}
.opt:hover{background:var(--bg)}
.opt .mk{flex:none;font-weight:700;width:2em}
.opt span:last-child{flex:1;min-width:0}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
details{margin-top:4px;border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:10px 2px;font-weight:700;font-size:15px;color:var(--green);display:flex;align-items:center;gap:8px;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▶";font-size:11px;transition:transform .12s}
details[open] summary::before{transform:rotate(90deg)}
.exp{padding:0 2px 12px;overflow-wrap:break-word}
.exp .a{font-weight:700;color:var(--ok);margin:0}
.exp .a span{color:var(--fg)}
.ko{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px;font-size:14.5px}
.ko li{display:flex;gap:10px}
.ko li b{flex:none;width:2em;color:var(--muted)}
.ko li.qk{color:var(--muted);margin-bottom:2px}
.ko li.right,.ko li.right b{color:var(--ok);font-weight:700}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.box h2{font-size:17px;margin:0;line-height:1.4}
.box .meta{font-size:13px;color:var(--muted);margin:2px 0 8px}
.box .note{background:var(--green-soft);border-left:3px solid var(--green);border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--green-soft);font-weight:700}
td:first-child{font-weight:700;white-space:nowrap}
.hide td.h{color:transparent;background:var(--bg);cursor:pointer;user-select:none}
.hide td.h.shown{color:inherit;background:var(--surface)}
.exq{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14.5px}
.exq li{background:var(--bg);border-radius:8px;padding:8px 10px}
.exq b{color:var(--ok)}
.hide .exq b{color:transparent;background:var(--line);border-radius:4px;cursor:pointer}
.hide .exq b.shown{color:var(--ok);background:transparent}
.words{display:grid;gap:8px}
.w{font:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--fg);min-height:52px;width:100%}
.w .en{font-weight:700;font-size:17px;overflow-wrap:break-word;min-width:0;flex:1}
.w .en.kq{font-weight:500;font-size:16px}
.w .tag{flex:none;font-size:11.5px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:6px;padding:1px 6px}
.w .kr{color:transparent;background:var(--bg);border-radius:6px;padding:2px 8px;font-size:15px;text-align:right;flex:none;max-width:60%}
.w.open .kr{color:var(--ok);background:var(--ok-soft);font-weight:700}
.w:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){summary::before{transition:none}}
</style>

<script>
const D={"lc": [{"day": "Day 03", "title": "Who·What·Which", "qs": [{"n": 1, "a": "A", "q": "Who created that logo?", "k": "누가 그 로고를 만들었나요?", "o": [["A", "Mr. Davis, I guess.", "Mr. Davis인 것 같아요."], ["B", "Four years ago.", "4년 전에요."], ["C", "No, that was your project.", "아니요, 그것은 당신의 프로젝트였어요."]]}, {"n": 2, "a": "B", "q": "Which hotel are you staying at for your vacation?", "k": "휴가 때 어떤 호텔에 묵을 예정인가요?", "o": [["A", "Stay as long as you like.", "원하는 만큼 묵으세요."], ["B", "The one you recommended.", "당신이 추천한 곳이요."], ["C", "An executive suite.", "고급 특실이요."]]}, {"n": 3, "a": "A", "q": "What do you need to buy at the mall?", "k": "쇼핑몰에서 무엇을 사야 하나요?", "o": [["A", "Some winter clothes.", "겨울옷 몇 벌이요."], ["B", "No, we don't have any.", "아니요, 우리는 아무것도 갖고 있지 않아요."], ["C", "We missed the sale.", "우리는 할인 판매를 놓쳤어요."]]}, {"n": 4, "a": "A", "q": "Which chef can handle the banquet tomorrow?", "k": "어느 주방장이 내일 연회를 담당할 수 있나요?", "o": [["A", "Chef Morales is available.", "Morales 주방장이 가능해요."], ["B", "Sorry, you're not on the list.", "죄송해요, 당신은 명단에 없어요."], ["C", "I booked a table for four.", "저는 네 명을 위한 테이블을 예약했어요."]]}, {"n": 5, "a": "C", "q": "Who qualifies for the annual membership discount?", "k": "누가 연간 회원권 할인을 받을 자격이 있나요?", "o": [["A", "It's the original price.", "이것은 원래 가격이에요."], ["B", "She filled out an application form.", "그녀는 신청서를 작성했어요."], ["C", "Current university students.", "현재 대학생들이요."]]}, {"n": 6, "a": "C", "q": "What is the best way to get to the airport?", "k": "공항에 가는 가장 좋은 방법은 무엇인가요?", "o": [["A", "About 20 kilometers from here.", "여기에서 약 20킬로미터 떨어져 있어요."], ["B", "To reserve a later flight.", "더 늦은 항공편을 예약하기 위해서요."], ["C", "A taxi would be the easiest.", "택시가 가장 쉬울 거예요."]]}, {"n": 7, "a": "A", "q": "Who wants a map to the auditorium?", "k": "누가 강당으로 가는 지도를 원하나요?", "o": [["A", "I've been there before.", "저는 전에 그곳에 가봤어요."], ["B", "The lights are too bright.", "조명이 너무 밝아요."], ["C", "Check the audio system.", "오디오 시스템을 점검해 보세요."]]}, {"n": 8, "a": "A", "q": "What do you think about the new user manual?", "k": "새로운 사용자 설명서에 대해 어떻게 생각하나요?", "o": [["A", "It's very well written.", "그것은 매우 잘 쓰여 있어요."], ["B", "No, I don't think so.", "아니요, 그렇게 생각하지 않아요."], ["C", "On a personal vacation.", "개인 휴가 중이에요."]]}, {"n": 9, "a": "C", "q": "Who's preparing the training program for the new employees?", "k": "누가 새로운 직원들을 위한 교육 프로그램을 준비하고 있나요?", "o": [["A", "It's supposed to rain tomorrow.", "내일 비가 올 예정이에요."], ["B", "A new computer program.", "새로운 컴퓨터 프로그램이요."], ["C", "Grace was assigned that task.", "Grace가 그 업무에 배정되었어요."]]}, {"n": 10, "a": "C", "q": "Which art class are you taking at the community center?", "k": "지역 문화 회관에서 어느 미술 수업을 듣고 있나요?", "o": [["A", "Twenty students in total.", "총 20명의 학생들이요."], ["B", "The center opens at 10 A.M.", "회관은 오전 10시에 문을 열어요."], ["C", "The pottery one.", "도예 수업이요."]]}, {"n": 11, "a": "C", "q": "Who can give the presentation at the trade fair?", "k": "누가 무역 박람회에서 발표를 할 수 있나요?", "o": [["A", "Within 90 days.", "90일 이내에요."], ["B", "A successful presentation.", "성공적인 발표요."], ["C", "I think Jane is free that day.", "Jane이 그날 시간이 있는 것 같아요."]]}, {"n": 12, "a": "C", "q": "What time does the next train depart?", "k": "다음 기차는 몇 시에 떠나나요?", "o": [["A", "You can wait at Gate 22.", "22번 승강장에서 기다리시면 돼요."], ["B", "Part of the time.", "그 시간 중 일부요."], ["C", "It leaves at 4 P.M.", "오후 4시에 떠나요."]]}, {"n": 13, "a": "C", "q": "Which local restaurant serves the best Italian food?", "k": "어느 현지 음식점이 최고의 이탈리아 음식을 제공하나요?", "o": [["A", "I need to get some rest tonight.", "전 오늘 밤 휴식을 좀 취해야 해요."], ["B", "The servings are pretty large.", "1인분이 꽤 많아요."], ["C", "My favorite is just down the street.", "제가 가장 좋아하는 곳은 길 바로 아래에 있어요."]]}, {"n": 14, "a": "B", "q": "Who has the schedule for next year's seminars?", "k": "내년 세미나들의 일정표를 누가 가지고 있죠?", "o": [["A", "I think it starts in February.", "제 생각에 그건 2월에 시작해요."], ["B", "The office assistant.", "사무 보조원이요."], ["C", "About communication skills.", "소통 기술들에 대해서요."]]}, {"n": 15, "a": "A", "q": "Which article did you end up revising?", "k": "어느 기사를 결국 수정하게 되었나요?", "o": [["A", "The one on global warming.", "지구 온난화에 대한 것이요."], ["B", "No, I need to revise it.", "아니요, 저는 그것을 수정해야 해요."], ["C", "Probably next week.", "아마 다음 주에요."]]}, {"n": 16, "a": "A", "q": "What was your impression of the house that we toured?", "k": "우리가 둘러본 집에 대한 당신의 느낌은 어땠나요?", "o": [["A", "The backyard was impressive.", "뒤뜰이 인상적이었어요."], ["B", "Tours start near the entrance.", "관광은 입구 근처에서 시작해요."], ["C", "I'll be home all day.", "전 종일 집에 있을 거예요."]]}, {"n": 17, "a": "B", "q": "Who's in charge of assembling the new machine?", "k": "새 기계를 조립하는 것은 누가 담당하나요?", "o": [["A", "To change the password.", "비밀번호를 변경하기 위해서요."], ["B", "I'll put it together.", "제가 조립할 거예요."], ["C", "Some heavy equipment.", "몇몇 중장비요."]]}, {"n": 18, "a": "C", "q": "What still needs to be done for the workshop?", "k": "워크숍을 위해 아직도 무엇이 완료되어야 하나요?", "o": [["A", "The shop across the street.", "길 건너편에 있는 상점이요."], ["B", "It was very informative.", "매우 유익했어요."], ["C", "Just print the handouts.", "유인물을 인쇄만 하세요."]]}, {"n": 19, "a": "B", "q": "What will be the program coordinator's role in the project?", "k": "그 프로젝트에서 프로그램 진행자의 역할은 무엇이 될 건가요?", "o": [["A", "Yes, I started the project.", "네, 제가 그 프로젝트를 시작했어요."], ["B", "I haven't decided yet.", "아직 결정하지 않았어요."], ["C", "They have to reprogram it.", "그들은 그것의 프로그램을 다시 짜야 해요."]]}, {"n": 20, "a": "B", "q": "Who can repair the air conditioner in my room?", "k": "누가 제 방에 있는 에어컨을 수리할 수 있나요?", "o": [["A", "The repairs were expensive.", "수리비가 비쌌어요."], ["B", "I can do that today.", "제가 오늘 할 수 있어요."], ["C", "It's a popular model.", "인기 있는 모델이에요."]]}, {"n": 21, "a": "C", "q": "What did the team leader suggest during the meeting?", "k": "팀장이 회의 중에 무엇을 제안했나요?", "o": [["A", "No, it has been addressed.", "아니요, 그것은 해결되었어요."], ["B", "We meet several times a week.", "우리는 일주일에 여러 번 만나요."], ["C", "He said we must reduce costs.", "그는 우리가 비용을 줄여야 한다고 말했어요."]]}, {"n": 22, "a": "C", "q": "What are you giving Derek for his birthday?", "k": "Derek의 생일에 무엇을 줄 건가요?", "o": [["A", "27 years old.", "27살이요."], ["B", "At nine in the evening.", "저녁 9시에요."], ["C", "I'm getting him a new wallet.", "저는 그에게 새 지갑을 사줄 거예요."]]}, {"n": 23, "a": "C", "q": "Which brand of oven are you planning to buy?", "k": "어느 브랜드의 오븐을 구매할 계획인가요?", "o": [["A", "Various vehicle brands.", "다양한 차량 브랜드요."], ["B", "I plan to bake some bread this afternoon.", "오늘 오후에 빵을 좀 구울 계획이에요."], ["C", "Doesn't HomeTek make great appliances?", "HomeTek사가 훌륭한 가전제품을 만들지 않나요?"]]}, {"n": 24, "a": "B", "q": "Who will conduct the customer survey?", "k": "누가 고객 설문조사를 실시할 건가요?", "o": [["A", "The survey responses were surprising.", "설문조사 응답이 놀라웠어요."], ["B", "The marketing team.", "마케팅팀이요."], ["C", "Several customer complaints.", "몇몇 고객 불만이요."]]}, {"n": 25, "a": "B", "q": "Which part of the city should I look for an apartment in?", "k": "도시의 어느 지역에서 아파트를 찾아봐야 하나요?", "o": [["A", "The one with two bedrooms.", "침실이 두 개인 것이요."], ["B", "Everyone seems to like the downtown area.", "모든 사람들이 도심 지역을 좋아하는 것 같아요."], ["C", "The building has just been renovated.", "그 건물은 막 개조되었어요."]]}]}, {"day": "Day 04", "title": "Where·When", "qs": [{"n": 1, "a": "C", "q": "When is the product launch going to be held?", "k": "제품 출시 행사는 언제 열릴 건가요?", "o": [["A", "Consumers seem to like the device.", "소비자들은 그 장치를 좋아하는 것 같아요."], ["B", "Here's the lunch menu.", "여기 점심 메뉴가 있어요."], ["C", "At the end of the month.", "이번 달 말에요."]]}, {"n": 2, "a": "A", "q": "Where's the nearest pharmacy?", "k": "가장 가까운 약국은 어디에 있나요?", "o": [["A", "Across from the bookstore.", "서점 건너편에요."], ["B", "My family doctor.", "저의 주치의요."], ["C", "From 9 A.M. to 7 P.M.", "오전 9시부터 오후 7시까지요."]]}, {"n": 3, "a": "B", "q": "When can you show us the survey results?", "k": "설문 조사 결과를 언제 보여줄 수 있나요?", "o": [["A", "A marketing plan.", "마케팅 계획이요."], ["B", "As soon as I've reviewed them.", "제가 검토하는 대로요."], ["C", "More than 50 people responded.", "50명이 넘는 사람들이 응답했어요."]]}, {"n": 4, "a": "C", "q": "Where's the emergency medical kit?", "k": "응급 의료용 키트는 어디에 있나요?", "o": [["A", "He's a trained medical worker.", "그는 훈련된 의료 종사자예요."], ["B", "The second Tuesday of the month.", "매월 두 번째 화요일이요."], ["C", "It's in one of the storeroom closets.", "창고 수납장 중 하나에 있어요."]]}, {"n": 5, "a": "A", "q": "When are you planning to leave for Bali?", "k": "발리로 언제 떠날 계획인가요?", "o": [["A", "On Tuesday.", "화요일에요."], ["B", "I'll pack your luggage.", "제가 당신의 짐을 쌀게요."], ["C", "They leave at noon.", "그들은 정오에 떠나요."]]}, {"n": 6, "a": "C", "q": "Where are we going to open another branch?", "k": "우리는 어디에 또 다른 지점을 열 예정인가요?", "o": [["A", "At the beginning of August.", "8월 초에요."], ["B", "Our Seoul office is closed.", "우리의 서울 사무실은 문을 닫았어요."], ["C", "The CEO still hasn't decided.", "최고 경영자가 아직 결정하지 못했어요."]]}, {"n": 7, "a": "B", "q": "When is the deadline for the blueprint revisions?", "k": "설계도 수정의 마감 기한은 언제인가요?", "o": [["A", "The building on Aspen Road.", "Aspen 도로에 있는 건물이요."], ["B", "At 10 A.M. tomorrow.", "내일 오전 10시에요."], ["C", "No. I don't need any help.", "아니요, 저는 도움이 필요하지 않아요."]]}, {"n": 8, "a": "C", "q": "Where did this amazing painting come from?", "k": "이 멋진 그림은 어디에서 왔나요?", "o": [["A", "To hang in the dining room.", "식당에 걸기 위해서요."], ["B", "The artist is world-famous.", "그 화가는 세계적으로 유명해요."], ["C", "The Sanderson Gallery.", "Sanderson 미술관이요."]]}, {"n": 9, "a": "A", "q": "When did we hire the accountant?", "k": "우리는 그 회계사를 언제 채용했나요?", "o": [["A", "He started here last month.", "그는 여기에서 지난달에 시작했어요."], ["B", "It was a long hiring process.", "긴 채용 과정이었어요."], ["C", "In the company's account.", "회사의 계좌에요."]]}, {"n": 10, "a": "B", "q": "Where's this shipment of chairs and tables going?", "k": "이 의자와 탁자 수송품은 어디로 가나요?", "o": [["A", "It will take only three hours.", "3시간만 걸릴 거예요."], ["B", "To the distribution center in Seattle.", "시애틀에 있는 물류 센터로요."], ["C", "About a hundred people will be there.", "약 100명의 사람들이 그곳에 있을 거예요."]]}, {"n": 11, "a": "B", "q": "When is ShoreTech's new phone coming out?", "k": "ShoreTech사의 새로운 휴대전화는 언제 나오나요?", "o": [["A", "He's back from a recent holiday.", "그는 최근 휴가에서 돌아왔어요."], ["B", "On Friday.", "금요일에요."], ["C", "With a long battery life.", "긴 배터리 수명을 가지고요."]]}, {"n": 12, "a": "B", "q": "Where are we supposed to meet for the workshop?", "k": "우리는 연수를 위해 어디에서 모이기로 되어 있나요?", "o": [["A", "Were there enough people?", "그곳에 사람들이 충분히 있었나요?"], ["B", "In Room 304.", "304호실에서요."], ["C", "Once the workshop ends.", "연수가 끝나자마자요."]]}, {"n": 13, "a": "A", "q": "When will the technician finish his repair work?", "k": "기술자는 언제 수리 작업을 끝낼 건가요?", "o": [["A", "He completed it this morning.", "그는 그것을 오늘 아침에 완료했어요."], ["B", "At the electronics store.", "전자제품 매장에서요."], ["C", "On a factory machine.", "공장 기계 위에요."]]}, {"n": 14, "a": "C", "q": "Where should I set up the intern's workstation?", "k": "인턴의 작업 장소를 어디에 마련해야 하나요?", "o": [["A", "A three-month internship.", "3개월 인턴십이요."], ["B", "Meet me at the train station.", "저와 기차역에서 만나요."], ["C", "This floor is already too crowded.", "이 층은 이미 너무 붐벼요."]]}, {"n": 15, "a": "B", "q": "When was that documentary about the whales aired?", "k": "고래에 관한 그 다큐멘터리는 언제 방송되었나요?", "o": [["A", "It was an episode about whales.", "그건 고래에 관한 방송분이었어요."], ["B", "Last Wednesday night.", "지난 수요일 밤이요."], ["C", "Yes, that's the one.", "네, 바로 그거예요."]]}, {"n": 16, "a": "A", "q": "When do you want to discuss the design changes?", "k": "디자인 수정에 대해 언제 논의하고 싶은가요?", "o": [["A", "Now would be perfect.", "지금이 딱 좋을 것 같아요."], ["B", "Several modifications.", "몇 가지 수정 사항이요."], ["C", "Yes, she is the designer.", "네, 그녀가 디자이너예요."]]}, {"n": 17, "a": "B", "q": "Where does the company conduct its board meetings?", "k": "회사는 어디에서 이사회를 실시하나요?", "o": [["A", "Only if you get bored.", "당신이 지루해할 경우에만요."], ["B", "Mr. Lewis would probably know.", "Mr. Lewis가 아마 알 거예요."], ["C", "I'll inform her about that.", "제가 그녀에게 그것에 대해 알려줄게요."]]}, {"n": 18, "a": "A", "q": "When is your dental appointment scheduled for?", "k": "당신의 치과 예약은 언제로 예정되어 있나요?", "o": [["A", "Early next week.", "다음 주 초에요."], ["B", "Yes, for a checkup.", "네, 검진을 위해서요."], ["C", "Sure. Ask the dentist.", "물론이죠. 치과 의사에게 물어보세요."]]}, {"n": 19, "a": "B", "q": "Where is the farmers' market being held?", "k": "농산물 직판장은 어디에서 열리나요?", "o": [["A", "The booths open at 8 A.M. each morning.", "부스는 매일 아침 8시에 열어요."], ["B", "It always takes place in the same venue.", "그건 항상 같은 장소에서 열려요."], ["C", "Only local residents will be participating.", "지역 주민들만 참여할 거예요."]]}, {"n": 20, "a": "A", "q": "When should I post the job advertisement?", "k": "구인 광고를 언제 게시해야 하나요?", "o": [["A", "Check with our team leader.", "우리 팀장님께 확인해 보세요."], ["B", "Of course. I'll take care of it.", "물론이죠. 제가 처리할게요."], ["C", "On our firm's Web site.", "우리 회사 웹사이트에요."]]}, {"n": 21, "a": "B", "q": "Where's the store manager?", "k": "매장 관리자는 어디에 있나요?", "o": [["A", "I'll accompany him.", "제가 그와 동행할게요."], ["B", "She's away on vacation.", "그녀는 휴가 중이라 자리에 없어요."], ["C", "A store catalog.", "매장 카탈로그요."]]}, {"n": 22, "a": "A", "q": "When do you think someone can stop by to pick up my box?", "k": "누군가가 제 상자를 가지러 언제 들를 수 있다고 생각하나요?", "o": [["A", "Is it ready to ship?", "보낼 준비가 되어 있나요?"], ["B", "It has a few of my personal belongings.", "그것은 제 개인 소지품 몇 개를 담고 있어요."], ["C", "Yes, it's already on the way.", "네, 그것은 이미 오는 중이에요."]]}, {"n": 23, "a": "A", "q": "Where is the application form for the seminar?", "k": "세미나의 신청서는 어디에 있나요?", "o": [["A", "On our department's Web page.", "우리 부서의 웹페이지에요."], ["B", "I've worked there for a while.", "저는 한동안 그곳에서 일해왔어요."], ["C", "As soon as the talk begins.", "강연이 시작되자마자요."]]}, {"n": 24, "a": "A", "q": "When did you find out that the clients want to renew the contract?", "k": "고객들이 계약을 연장하기를 원한다는 것을 언제 알게 되었나요?", "o": [["A", "During a business lunch.", "사업상의 점심 식사 동안에요."], ["B", "Some clients asked for a discount.", "몇몇 고객들이 할인을 요청했어요."], ["C", "My contact information.", "제 연락처요."]]}, {"n": 25, "a": "C", "q": "Where do we go after watching the product demonstration?", "k": "제품 시연을 본 이후에 우리는 어디에 가나요?", "o": [["A", "The other members of our division.", "우리 부서의 다른 사람들이요."], ["B", "That movie was very interesting.", "그 영화는 매우 흥미로웠어요."], ["C", "To the main lobby.", "중앙 로비로요."]]}]}, {"day": "Day 05", "title": "Why·How", "qs": [{"n": 1, "a": "C", "q": "Why was the workshop postponed?", "k": "워크숍은 왜 연기되었나요?", "o": [["A", "About marketing strategies.", "마케팅 전략들에 대해서요."], ["B", "No, yesterday afternoon.", "아니요, 어제 오후예요."], ["C", "Not enough people registered.", "충분한 사람들이 등록하지 않았어요."]]}, {"n": 2, "a": "A", "q": "How often are the reports published?", "k": "보고서는 얼마나 자주 발행되나요?", "o": [["A", "Once every month.", "매달 한 번씩이요."], ["B", "A financial consultant is working on it.", "재무 컨설턴트가 그것을 작업하고 있어요."], ["C", "Yes, they should be created.", "네, 그것들은 제작되어야 해요."]]}, {"n": 3, "a": "B", "q": "How did you get the idea to start a delivery service?", "k": "배달 서비스를 시작할 아이디어를 어떻게 얻으셨나요?", "o": [["A", "Terry will get a job.", "Terry가 직장을 구할 거예요."], ["B", "My friend suggested it.", "제 친구가 그것을 제안했어요."], ["C", "I appreciate the offer.", "제안해 주셔서 감사해요."]]}, {"n": 4, "a": "C", "q": "Why isn't the printer working?", "k": "프린터가 왜 작동하지 않나요?", "o": [["A", "Print your name at the top.", "상단에 이름을 작성해 주세요."], ["B", "In my home office.", "제 재택 사무실에요."], ["C", "It's out of paper.", "종이가 떨어졌어요."]]}, {"n": 5, "a": "A", "q": "Why did you buy a backpack instead of a suitcase?", "k": "여행 가방 대신 왜 배낭을 구매하셨나요?", "o": [["A", "It's more convenient.", "더 편리해요."], ["B", "Let's pack them with clothes.", "그것들에 옷을 챙겨 넣읍시다."], ["C", "At a local luggage shop.", "지역 가방 가게에서요."]]}, {"n": 6, "a": "B", "q": "How often does the subway train come?", "k": "지하철은 얼마나 자주 오나요?", "o": [["A", "How many tickets do you need?", "표가 몇 장 필요하신가요?"], ["B", "Every 10 minutes.", "10분마다요."], ["C", "Right down the road.", "길 바로 아래요."]]}, {"n": 7, "a": "A", "q": "Why are you waiting for Ms. Anderson?", "k": "당신은 왜 Ms. Anderson을 기다리고 있나요?", "o": [["A", "We need to talk about production rates.", "우리는 생산율에 대해 논의해야 해요."], ["B", "You can wait by the door.", "문 옆에서 기다리시면 돼요."], ["C", "Yes, tell her for me.", "네, 저 대신 그녀에게 말해 주세요."]]}, {"n": 8, "a": "C", "q": "How many chairs do we need for the dinner party?", "k": "만찬 모임을 위해 몇 개의 의자가 필요한가요?", "o": [["A", "By invitation only.", "초대장으로만요."], ["B", "Just put them in that room.", "그것들을 저 방에 두세요."], ["C", "Nine in total.", "모두 합해서 9개요."]]}, {"n": 9, "a": "A", "q": "Why was the sales meeting rescheduled?", "k": "영업 회의의 일정은 왜 변경되었나요?", "o": [["A", "Well, the manager didn't give a reason.", "음, 관리자가 이유를 대지 않았어요."], ["B", "Update the price list.", "가격표를 갱신하세요."], ["C", "Be sure to review the agenda.", "반드시 안건을 검토하세요."]]}, {"n": 10, "a": "A", "q": "How did you learn about our research?", "k": "당신은 우리의 연구에 대해 어떻게 알게 되었나요?", "o": [["A", "Through a Web site.", "웹사이트를 통해서요."], ["B", "About health products.", "건강 제품들에 대해서요."], ["C", "A challenging course.", "힘든 강의요."]]}, {"n": 11, "a": "C", "q": "Why aren't we beginning the discussion now?", "k": "우리는 왜 지금 논의를 시작하지 않고 있나요?", "o": [["A", "I don't know when it is.", "저는 그게 언제인지 모르겠어요."], ["B", "I found it very informative.", "그것이 매우 유익하다고 생각했어요."], ["C", "We're waiting for Helen.", "우리는 Helen을 기다리는 중이에요."]]}, {"n": 12, "a": "C", "q": "How far away is the supermarket from here?", "k": "슈퍼마켓은 여기에서 얼마나 멀리 있나요?", "o": [["A", "We'll get groceries in an hour.", "우리는 한 시간 후에 식료품을 살 거예요."], ["B", "I'm here until March.", "저는 3월까지 여기에 있어요."], ["C", "Only five or six blocks.", "다섯에서 여섯 블록밖에 안 돼요."]]}, {"n": 13, "a": "B", "q": "Why is the store on North Avenue closed today?", "k": "North가에 있는 매장은 왜 오늘 문을 닫았나요?", "o": [["A", "The nearest one is on Broad Street.", "가장 가까운 곳은 Broad가에 있어요."], ["B", "Because it's being renovated.", "보수공사 중이기 때문이에요."], ["C", "Yes, a notification will be posted.", "네, 공지가 게시될 거예요."]]}, {"n": 14, "a": "A", "q": "How long will you be visiting your cousin in Hartford?", "k": "Hartford에 있는 사촌을 얼마나 오랫동안 방문할 예정인가요?", "o": [["A", "Only for a few days.", "며칠 만이요."], ["B", "Thanks for visiting me.", "방문해 주셔서 감사합니다."], ["C", "Every chance I get.", "기회가 있을 때마다요."]]}, {"n": 15, "a": "C", "q": "Why hasn't the air conditioner been replaced?", "k": "에어컨이 왜 교체되지 않았나요?", "o": [["A", "A new order was placed this morning.", "오늘 아침에 새 주문이 이루어졌어요."], ["B", "The antique is in good condition.", "골동품의 상태가 좋아요."], ["C", "Have you seen the cost estimate?", "비용 견적서를 보셨나요?"]]}, {"n": 16, "a": "B", "q": "How's the building design coming along?", "k": "건물 디자인은 어떻게 되어 가고 있나요?", "o": [["A", "From the architectural designer.", "건축 디자이너로부터요."], ["B", "The initial draft is nearly complete.", "초기 도면이 거의 다 끝났어요."], ["C", "Come early to get a seat, please.", "자리를 잡으려면 일찍 오세요."]]}, {"n": 17, "a": "A", "q": "Why are the orchestra members meeting tomorrow morning?", "k": "오케스트라 회원들은 왜 내일 아침에 모이나요?", "o": [["A", "Because they need to discuss the season's schedule.", "그들은 시즌 일정에 대해 논의할 필요가 있기 때문이에요."], ["B", "I met with her recently as well.", "저 또한 최근에 그녀와 만났어요."], ["C", "They loved the performance.", "그들은 그 공연을 좋아했어요."]]}, {"n": 18, "a": "C", "q": "How can I watch movies with this streaming app?", "k": "이 스트리밍 앱으로 어떻게 영화를 볼 수 있나요?", "o": [["A", "I thought the ending was good.", "저는 결말이 좋다고 생각했어요."], ["B", "To make space on my phone.", "제 휴대전화에 공간을 만들기 위해서요."], ["C", "By signing up for a membership.", "회원 가입을 해서요."]]}, {"n": 19, "a": "A", "q": "Why was the publication deadline extended?", "k": "출판 마감일은 왜 연장되었나요?", "o": [["A", "Because we found some errors.", "우리가 몇몇 오류를 발견했기 때문이에요."], ["B", "They're extending the office hours.", "그들은 근무 시간을 연장하고 있어요."], ["C", "You missed the deadline.", "당신은 마감일을 놓쳤어요."]]}, {"n": 20, "a": "B", "q": "How many volunteers do you need for the expo?", "k": "박람회를 위해 몇 명의 자원봉사자들이 필요한가요?", "o": [["A", "I can be there when it opens.", "개장할 때 저는 그곳에 있을 수 있어요."], ["B", "Three or four would be great.", "3명이나 4명이면 좋을 것 같아요."], ["C", "On Sunday night.", "일요일 밤에요."]]}, {"n": 21, "a": "A", "q": "Why does your team require additional members?", "k": "당신의 팀은 왜 추가적인 팀원을 필요로 하나요?", "o": [["A", "Because we will have a lot of work.", "왜냐하면 저희에게 많은 업무가 있을 것이어서요."], ["B", "The personnel manager has the form.", "인사 관리자가 양식을 가지고 있어요."], ["C", "It doesn't charge any extra fees.", "그것은 추가 요금을 부과하지 않아요."]]}, {"n": 22, "a": "A", "q": "How much will it cost to repaint the reception area?", "k": "접수 구역을 다시 칠하는 데 비용이 얼마나 들까요?", "o": [["A", "I've requested an estimate.", "제가 견적을 요청했어요."], ["B", "From a new receptionist.", "새 접수원으로부터요."], ["C", "Should we hang the painting here?", "여기에 그림을 걸어야 할까요?"]]}, {"n": 23, "a": "C", "q": "Why was the baseball game canceled?", "k": "야구 경기는 왜 취소되었나요?", "o": [["A", "I'll meet you at the stadium.", "경기장에서 만나겠습니다."], ["B", "My favorite team won the championship.", "제가 좋아하는 팀이 선수권 대회에서 이겼어요."], ["C", "Because it was raining too heavily.", "비가 너무 많이 내리고 있었기 때문이에요."]]}, {"n": 24, "a": "A", "q": "How do our employees feel about the new leave policy?", "k": "우리 직원들은 새로운 휴가 정책에 대해 어떻게 생각하나요?", "o": [["A", "No one has complained yet.", "아직 아무도 불평하지 않았어요."], ["B", "For about two weeks in June.", "6월에 약 2주 동안이요."], ["C", "My leave was approved.", "제 휴가가 승인되었어요."]]}, {"n": 25, "a": "B", "q": "Why did the staff find it difficult to follow the instructions?", "k": "직원들은 왜 지시 사항을 따르는 것이 어렵다고 느꼈나요?", "o": [["A", "Most of the collections.", "수집품들의 대부분이요."], ["B", "There were no examples included.", "아무런 예시들이 포함되어 있지 않았어요."], ["C", "The director of the company.", "그 회사의 관리자요."]]}]}, {"day": "Day 06", "title": "일반·선택 의문문", "qs": [{"n": 1, "a": "B", "q": "Can we get a discount at the amusement park?", "k": "우리가 놀이공원에서 할인을 받을 수 있나요?", "o": [["A", "On that ride.", "저 놀이 기구 위에요."], ["B", "Yes. I have a coupon.", "네. 저는 쿠폰이 있어요."], ["C", "To the nearby park.", "가까운 공원으로요."]]}, {"n": 2, "a": "B", "q": "Should I call the CEO or meet with her?", "k": "제가 최고경영자에게 전화를 해야 하나요, 아니면 만나야 하나요?", "o": [["A", "No, it's quite cool outside.", "아니요, 밖은 꽤 시원합니다."], ["B", "You'd better see her in person.", "당신은 그녀를 직접 보는 게 좋을 거예요."], ["C", "It was a pleasure to meet you.", "당신을 만나 뵙게 되어 영광이었어요."]]}, {"n": 3, "a": "A", "
